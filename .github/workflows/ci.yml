name: Source and package checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python tools/audit_publication.py
      - run: python tools/package_release.py --addon-only
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug build
        working-directory: native-app
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Validate and package
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-pico-bridge-debug-packages
          path: dist/release/
          retention-days: 7
