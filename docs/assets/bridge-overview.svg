<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
  <title id="title">Blender to PICO Emulator bridge</title>
  <desc id="desc">Blender publishes GLB, PBR textures and timeline state over a local authenticated connection. A native PICO app renders and lets you inspect the model in the emulator.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10242c"/><stop offset="1" stop-color="#101725"/></linearGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#67e4c1" stroke-width="1.5"/></marker></defs>
  <rect width="1040" height="300" rx="22" fill="url(#bg)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="38" y="43" fill="#99b5c5" font-size="13" letter-spacing="2">LOCAL SCENE SYNC · EMULATOR FIRST</text>
    <rect x="38" y="75" width="280" height="160" rx="14" fill="#1b3039" stroke="#385260"/>
    <text x="60" y="111" fill="#ffffff" font-size="25" font-weight="bold">Blender</text>
    <text x="60" y="141" fill="#c5d5dd" font-size="16">Your model, materials &amp; animation</text>
    <text x="60" y="180" fill="#67e4c1" font-size="16">PICO Bridge add-on</text>
    <text x="60" y="208" fill="#99b5c5" font-size="14">Collection · Selection · Visible scene</text>
    <path d="M337 155 H683" stroke="#67e4c1" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="510" y="119" fill="#e5f0f4" font-size="18" text-anchor="middle">GLB + PBR + timeline</text>
    <text x="510" y="189" fill="#99b5c5" font-size="15" text-anchor="middle">Local HTTP · pairing token</text>
    <text x="510" y="212" fill="#99b5c5" font-size="14" text-anchor="middle">ADB reverse → 127.0.0.1:8766</text>
    <rect x="704" y="75" width="298" height="160" rx="14" fill="#1b3039" stroke="#385260"/>
    <text x="726" y="111" fill="#ffffff" font-size="25" font-weight="bold">PICO Emulator</text>
    <text x="726" y="141" fill="#c5d5dd" font-size="16">Native spatial viewport</text>
    <text x="726" y="180" fill="#67e4c1" font-size="16">Move · Rotate · Scale · Explode</text>
    <text x="726" y="208" fill="#99b5c5" font-size="14">Kotlin · Spatial SDK 6.1</text>
    <text x="38" y="271" fill="#99b5c5" font-size="14">macOS Apple Silicon tested · Windows setup documented · No headset or Unity required</text>
  </g>
</svg>
